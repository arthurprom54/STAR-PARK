      - name: Validar sintaxe JavaScript e integridade do HTML/CSS
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check server.mjs
          node --check public/app.js
          node --check public/starpark-next.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class CheckHTML(HTMLParser):
              def error(self, message): raise RuntimeError(message)
          parser=CheckHTML(); parser.feed(Path('public/index.html').read_text(encoding='utf-8')); parser.close()
          css=Path('public/starpark-next.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS com chaves desbalanceadas.')
          html=Path('public/index.html').read_text(encoding='utf-8')
          for marker in ['starpark-next.js','starpark-next.css','starparkAwaitingWhatsapp','spGoalForm','starparkSystemMonitor']:
              if marker not in html: raise SystemExit(f'Marcador ausente no HTML: {marker}')
          print('HTML e CSS passaram na verificacao estrutural.')
          PY

      - name: Instalar dependencias sem alterar o manifesto
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Executar todos os testes existentes
        shell: bash
        run: npm test

      - name: Testes adicionais do novo fluxo
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const server=fs.readFileSync('server.mjs','utf8');
          const html=fs.readFileSync('public/index.html','utf8');
          const next=fs.readFileSync('public/starpark-next.js','utf8');
          assert.match(server,/status:'AWAITING_WHATSAPP'/);
          assert.match(server,/reservationExpiresAt:null/);
          assert.match(server,/whatsappCommunityUrl:WHATSAPP_COMMUNITY_URL/);
          assert.match(server,/m\.applicationId===app\.id/);
          assert.match(server,/event-registration\/cancel/);
          assert.match(server,/api\/public\/goals/);
          assert.match(server,/username\|\|body\.email/);
          assert.match(html,/starparkAwaitingWhatsapp/);
          assert.match(html,/name="username"/);
          assert.match(next,/Previa do perfil Brawl Stars/);
          assert.match(next,/ENTRAR NA COMUNIDADE DO WHATSAPP/);
          assert.match(next,/Linha do tempo/);
          assert.match(next,/Conquistas e medalhas/);
          assert.match(html,/Central de monitoramento/);
          assert.match(next,/data-sp-close-goal/);
          assert.match(next,/type=\"button\" class=\"mini-action danger\" data-sp-close-goal/);
          console.log('Testes adicionais de integracao aprovados.');
          NODE

      - name: Verificar diff e impedir exclusoes inesperadas
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          if git diff --name-status | awk '$1 ~ /^D/ {found=1} END {exit found ? 0 : 1}'; then
            echo 'ERRO: a atualizacao tentou excluir arquivos. Interrompendo.'
            git diff --name-status
            exit 1
          fi
          python3 - <<'PY'
          import json, subprocess
          before=json.loads(subprocess.check_output(['git','show','HEAD:package.json'],text=True))
          after=json.load(open('package.json',encoding='utf-8'))
          before['version']=after.get('version')
          if after.get('version')!='5.1.0' or before!=after:
              raise SystemExit('package.json sofreu alteracoes alem da versao 5.1.0.')
          PY
          git diff --stat

      - name: Criar branch e enviar a atualizacao validada
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Nenhuma mudanca nova foi necessaria.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="star-park/grande-atualizacao-${GITHUB_RUN_NUMBER}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add package.json README.md server.mjs public/index.html public/app.js public/styles.css public/starpark-next.js public/starpark-next.css
          git add lib/firestore-store.mjs
          git commit -m "feat(star-park): grande atualizacao segura 5.1.0"
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "### Atualizacao validada" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: \\`$BRANCH\\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Os testes passaram. A branch foi enviada sem alterar a branch principal.' >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir Pull Request para revisao
        if: steps.publish.outputs.changed == 'true' && inputs.criar_pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.publish.outputs.branch }}
        shell: bash
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Pull Request existente: $EXISTING" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "STAR PARK 5.1.0 - Grande atualizacao segura" \
            --body "## O que esta proposta atualiza\n- Candidatura encaminhada automaticamente para Aguardando WhatsApp, com link da comunidade.\n- Confirmacao manual e protecao contra membros duplicados.\n- Previa da tag Brawl Stars antes do envio.\n- Login compativel com nome de usuario e e-mail legado; senha minima de 6 caracteres para novas solicitacoes de conta.\n- Cancelamento de inscricao em eventos, conquistas, linha do tempo, notificacoes, metas coletivas, personalizacao de perfil, onboarding e monitoramento.\n\n## Validacao\n- Node 22 e verificacao de sintaxe.\n- npm test.\n- Testes adicionais do fluxo novo.\n- Nenhum arquivo excluido; package.json alterado somente para a versao 5.1.0.\n\nEsta PR nao altera dados de producao nem executa migracoes no Firestore. Revise antes de mesclar."

      - name: Resumo final
        if: always()
        shell: bash
        env:
          BRANCH: ${{ steps.publish.outputs.branch }}
          CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          {
            echo '## STAR PARK - Resultado'
            echo "- Resultado: ${{ job.status }}"
            echo "- Branch proposta: ${BRANCH:-nao criada}"
            echo "- Arquivos alterados: ${CHANGED:-nao confirmado}"
            echo '- O workflow nao publica diretamente na branch principal.'
            echo '- O workflow nao executa migracoes nem grava dados no Firestore.'
            echo '- O backup de codigo-fonte esta nos artefatos desta execucao por 14 dias.'
            echo '- Se a Pull Request nao puder ser aberta, use a branch criada para revisao manual.'
          } >> "$GITHUB_STEP_SUMMARY"
