name: STAR PARK - Grande Atualizacao Segura

on:
  workflow_dispatch:
    inputs:
      criar_pull_request:
        description: "Tentar abrir uma Pull Request para revisar a atualizacao"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: star-park-grande-atualizacao
  cancel-in-progress: false

jobs:
  preparar-validar-e-propor:
    name: Preparar, testar e propor a atualizacao
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o codigo atual
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Conferir estrutura e criar backup do codigo
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f package.json
          test -f server.mjs
          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css
          test -f lib/firestore-store.mjs
          node -e "const p=require('./package.json'); if(Number(String(p.engines?.node||'').match(/\\d+/)?.[0]||0)>22) process.exit(1); if(!p.scripts?.test) process.exit(2); console.log('Projeto:',p.name,'versao:',p.version)"
          if git ls-files | grep -E '(^|/)(\.env|serviceAccountKey\.json|firebase-service-account[^/]*\.json|.*\.pem)$' >/tmp/starpark-sensitive-files.txt; then
            echo 'ERRO: existem arquivos potencialmente sensiveis versionados. Backup cancelado.'
            cat /tmp/starpark-sensitive-files.txt
            exit 1
          fi
          mkdir -p /tmp/starpark-source-backup
          tar -czf /tmp/starpark-source-backup/star-park-source-before-update.tar.gz \
            package.json README.md server.mjs public/index.html public/app.js public/styles.css \
            lib tests scripts firestore.rules
          sha256sum /tmp/starpark-source-backup/star-park-source-before-update.tar.gz

      - name: Guardar backup do codigo-fonte
        uses: actions/upload-artifact@v7
        with:
          name: star-park-codigo-antes-da-atualizacao-${{ github.run_number }}
          path: /tmp/starpark-source-backup/star-park-source-before-update.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Aplicar atualizacao com verificacao de marcadores
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/apply-starpark-update.py <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          ROOT = Path.cwd()
          WA_URL = 'https://chat.whatsapp.com/L5n55x9ad4e3IFxSx5wE7Z'

          def read(rel):
              p = ROOT / rel
              if not p.is_file():
                  raise SystemExit(f'Arquivo obrigatorio ausente: {rel}')
              return p.read_text(encoding='utf-8')

          def write(rel, content):
              (ROOT / rel).write_text(content, encoding='utf-8', newline='\n')

          def replace_once(content, old, new, label):
              count = content.count(old)
              if count == 0:
                  if new in content:
                      return content
                  raise SystemExit(f'Ponto de integracao nao encontrado: {label}. Nenhuma alteracao foi confirmada.')
              if count != 1:
                  raise SystemExit(f'Ponto de integracao ambiguo ({count} ocorrencias): {label}. Interrompendo por seguranca.')
              return content.replace(old, new, 1)

          def ensure_version(source):
              match = re.search(r"const APP_VERSION = '([^']+)';", source)
              if not match:
                  raise SystemExit('Nao foi possivel identificar APP_VERSION.')
              if match.group(1) not in ('5.0.3', '5.1.0'):
                  raise SystemExit(f'Versao inesperada ({match.group(1)}). A atualizacao foi interrompida para evitar incompatibilidade.')
              return source.replace(match.group(0), "const APP_VERSION = '5.1.0';", 1)

          server = read('server.mjs')
          index = read('public/index.html')
          app = read('public/app.js')
          css = read('public/styles.css')
          store_lib = read('lib/firestore-store.mjs')
          package_text = read('package.json')
          readme = read('README.md')

          package_data = json.loads(package_text)
          if package_data.get('version') not in ('5.0.3', '5.1.0'):
              raise SystemExit('Versao do package.json inesperada. Interrompendo para revisao.')
          package_data['version'] = '5.1.0'
          package_text = json.dumps(package_data, ensure_ascii=False, indent=2) + '\n'
          readme = replace_once(readme, '# STAR PARK 5.0.2', '# STAR PARK 5.1.0', 'titulo da documentacao')

          server = ensure_version(server)
          server = replace_once(
              server,
              "const SESSION_SECRET = process.env.STAR_PARK_SESSION_SECRET || '';",
              "const SESSION_SECRET = process.env.STAR_PARK_SESSION_SECRET || '';\nconst WHATSAPP_COMMUNITY_URL = process.env.STAR_PARK_WHATSAPP_COMMUNITY_URL || '" + WA_URL + "';",
              'configuracao da comunidade WhatsApp'
          )
          server = replace_once(
              server,
              "function publicUser(user){return {id:user.id,name:user.name,email:user.email,role:user.role,permissions:user.permissions||rolePermissions[user.role]||[],createdAt:user.createdAt};}",
              "function publicUser(user){return {id:user.id,name:user.name,username:user.username||null,email:user.email||null,role:user.role,permissions:user.permissions||rolePermissions[user.role]||[],createdAt:user.createdAt};}",
              'serializacao segura do usuario'
          )
          server = replace_once(
              server,
              "if(req.method==='GET'&&url.pathname==='/api/public/settings')return sendJSON(res,200,{recruitmentOpen:store.settings.recruitmentOpen,recruitmentClosedMessage:store.settings.recruitmentClosedMessage});",
              "if(req.method==='GET'&&url.pathname==='/api/public/settings')return sendJSON(res,200,{recruitmentOpen:store.settings.recruitmentOpen,recruitmentClosedMessage:store.settings.recruitmentClosedMessage,whatsappCommunityUrl:WHATSAPP_COMMUNITY_URL});",
              'configuracao publica do recrutamento'
          )

          old_application = "status:'PENDING',apiLookupStatus,trophiesAtApplication,applicationTrophiesCapturedAt,submittedAt:nowISO(),createdAt:nowISO(),updatedAt:nowISO(),privateNotes:[],history:[{status:'PENDING',at:nowISO(),by:'Sistema'}],reservationExpiresAt:new Date(Date.now()+store.settings.reservationHours*3600000).toISOString()"
          new_application = "status:'AWAITING_WHATSAPP',apiLookupStatus,trophiesAtApplication,applicationTrophiesCapturedAt,submittedAt:nowISO(),createdAt:nowISO(),updatedAt:nowISO(),privateNotes:[],history:[{status:'AWAITING_WHATSAPP',at:nowISO(),by:'Sistema',reason:'Avanco automatico para confirmacao manual de entrada na comunidade WhatsApp.'}],reservationExpiresAt:null,whatsappCommunityUrl:WHATSAPP_COMMUNITY_URL"
          server = replace_once(server, old_application, new_application, 'estado inicial da candidatura')
          server = replace_once(
              server,
              "return sendJSON(res,201,{ok:true,applicationId:application.id,status:application.status,apiLookupStatus,message:'Candidatura recebida. A administração fará a análise.'});",
              "return sendJSON(res,201,{ok:true,applicationId:application.id,status:application.status,apiLookupStatus,whatsappCommunityUrl:WHATSAPP_COMMUNITY_URL,message:'Candidatura recebida e encaminhada para confirmacao de entrada no WhatsApp. Entre pelo link e aguarde a verificacao manual da administracao.'});",
              'resposta de envio da candidatura'
          )

          # Login novo por nome de usuario, mantendo compatibilidade com e-mails antigos.
          server = replace_once(
              server,
              "rateLimit(req,'login',12,15*60*1000);const body=await bodyJSON(req,5000);const email=safeText(body.email,180).toLowerCase();const password=String(body.password||'');const user=store.users.find(u=>u.email===email&&!u.disabled);",
              "rateLimit(req,'login',12,15*60*1000);const body=await bodyJSON(req,5000);const identifier=safeText(body.identifier||body.username||body.email,180).toLowerCase();const password=String(body.password||'');const user=store.users.find(u=>(String(u.username||'').toLowerCase()===identifier||String(u.email||'').toLowerCase()===identifier)&&!u.disabled);",
              'login compativel com usuario e e-mail antigo'
          )

          # Solicitacao opcional de conta: aceita usuario e senha de 6 caracteres;
          # e-mail passa a ser opcional, mas os pedidos legados continuam validos.
          old_req = "const email=safeText(body.email,180).toLowerCase();\n      const tag=cleanTag(body.playerTag);\n      const password=String(body.password||'');\n      if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))throw httpError(400,'Informe um e-mail válido.');\n      if(!tagIsValid(tag))throw httpError(400,'Tag de jogador inválida. Confira a tag no Brawl Stars.');\n      if(password.length<12||password.length>128)throw httpError(400,'A senha precisa ter entre 12 e 128 caracteres.');"
          new_req = "const username=safeText(body.username,24).toLowerCase();\n      const email=safeText(body.email,180).toLowerCase();\n      const tag=cleanTag(body.playerTag);\n      const password=String(body.password||'');\n      if(!username&&!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))throw httpError(400,'Informe um nome de usuario ou um e-mail valido.');\n      if(username&&!/^[a-z0-9._-]{3,24}$/.test(username))throw httpError(400,'O nome de usuario deve ter de 3 a 24 caracteres: letras, numeros, ponto, hifen ou sublinhado.');\n      if(email&&!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))throw httpError(400,'E-mail invalido.');\n      if(!tagIsValid(tag))throw httpError(400,'Tag de jogador inválida. Confira a tag no Brawl Stars.');\n      if(password.length<6||password.length>128)throw httpError(400,'A senha precisa ter entre 6 e 128 caracteres.');"
          server = replace_once(server, old_req, new_req, 'validacao de solicitacao opcional de conta')
          server = replace_once(
              server,
              "if(store.users.some(u=>u.email===email))throw httpError(409,'Este e-mail já possui uma conta. Tente entrar ou fale com a administração.');",
              "if(store.users.some(u=>(email&&u.email===email)||(username&&u.username===username)))throw httpError(409,'Este nome de usuario ou e-mail ja possui uma conta. Tente entrar ou fale com a administracao.');",
              'unicidade de usuario na solicitacao de conta'
          )
          server = replace_once(
              server,
              "if(store.accountRequests.some(r=>r.status==='PENDING'&&(r.email===email||r.memberId===member.id)))throw httpError(409,'Já existe uma solicitação de acesso aguardando análise para este e-mail ou membro.');",
              "if(store.accountRequests.some(r=>r.status==='PENDING'&&((email&&r.email===email)||(username&&r.username===username)||r.memberId===member.id)))throw httpError(409,'Ja existe uma solicitacao de acesso aguardando analise para este usuario ou membro.');",
              'unicidade de solicitacao de conta'
          )
          server = replace_once(
              server,
              "const requestRecord={id:id(),memberId:member.id,displayName:member.displayName,playerTag:tag,email,salt,passwordHash,status:'PENDING',createdAt:nowISO(),reviewedAt:null,reviewedBy:null};",
              "const requestRecord={id:id(),memberId:member.id,displayName:member.displayName,playerTag:tag,username:username||null,email:email||null,salt,passwordHash,status:'PENDING',createdAt:nowISO(),reviewedAt:null,reviewedBy:null};",
              'armazenamento seguro do usuario solicitado'
          )
          server = replace_once(
              server,
              "if(store.users.some(u=>u.email===email)||store.users.some(u=>u.role==='MEMBER'&&u.memberId===currentMember.id)||store.accountRequests.some(r=>r.status==='PENDING'&&(r.email===email||r.memberId===currentMember.id)))throw httpError(409,'Já existe uma conta ou solicitação para este e-mail ou membro.');",
              "if(store.users.some(u=>(email&&u.email===email)||(username&&u.username===username))||store.users.some(u=>u.role==='MEMBER'&&u.memberId===currentMember.id)||store.accountRequests.some(r=>r.status==='PENDING'&&((email&&r.email===email)||(username&&r.username===username)||r.memberId===currentMember.id)))throw httpError(409,'Ja existe uma conta ou solicitacao para este usuario ou membro.');",
              'verificacao transacional de conta duplicada'
          )
          server = replace_once(
              server,
              "if(store.users.some(u=>u.email===current.email))throw httpError(409,'Este e-mail já foi utilizado por outra conta.');",
              "if((current.email&&store.users.some(u=>u.email===current.email))||(current.username&&store.users.some(u=>u.username===current.username)))throw httpError(409,'Este usuario ou e-mail ja foi utilizado por outra conta.');",
              'unicidade durante aprovacao de conta'
          )
          server = replace_once(
              server,
              "created={id:id(),name:member.displayName,email:current.email,role:'MEMBER',memberId:member.id,permissions:defaultPermissions('MEMBER'),salt:current.salt,passwordHash:current.passwordHash,createdAt:nowISO(),disabled:false};",
              "created={id:id(),name:member.displayName,username:current.username||null,email:current.email||null,role:'MEMBER',memberId:member.id,permissions:defaultPermissions('MEMBER'),salt:current.salt,passwordHash:current.passwordHash,createdAt:nowISO(),disabled:false};",
              'criacao de conta aprovada com usuario'
          )
          server = replace_once(
              server,
              "if(req.method==='POST'&&url.pathname==='/api/admin/users'){checkCsrf(req);if(user?.role!=='OWNER')throw httpError(403,'Somente o OWNER pode criar contas e convites.');const body=await bodyJSON(req);const name=safeText(body.name,60),email=safeText(body.email,180).toLowerCase(),password=String(body.password||''),role=safeText(body.role,20);if(!name||!email.includes('@')||password.length<12||!roles.has(role)||role==='OWNER')throw httpError(400,'Dados inválidos. Senha mínima de 12 caracteres; OWNER não pode ser criado por este formulário.');if(store.users.some(u=>u.email===email))throw httpError(409,'Já existe uma conta com este e-mail.');const salt=crypto.randomBytes(16).toString('hex');const passwordHash=(await scrypt(password,salt,64)).toString('hex');if(role!=='MEMBER'&&user.role!=='OWNER')throw httpError(403,'Somente o OWNER pode criar contas administrativas.');const memberId=safeText(body.memberId,80)||null;if(role==='MEMBER'&&(!memberId||!store.members.some(m=>m.id===memberId&&m.status==='ACTIVE')))throw httpError(400,'Associe a conta a um membro ativo.');const created={id:id(),name,email,role,memberId,permissions:defaultPermissions(role),salt,passwordHash,createdAt:nowISO(),disabled:false};await mutate(()=>{if(store.users.some(u=>u.email===email))throw httpError(409,'Já existe uma conta com este e-mail.');store.users.push(created);audit(user,'Conta criada',`${email} • ${role}`);});return sendJSON(res,201,{ok:true,user:publicUser(created)});}",
              "if(req.method==='POST'&&url.pathname==='/api/admin/users'){checkCsrf(req);if(user?.role!=='OWNER')throw httpError(403,'Somente o OWNER pode criar contas e convites.');const body=await bodyJSON(req);const name=safeText(body.name,60),username=safeText(body.username,24).toLowerCase(),email=safeText(body.email,180).toLowerCase(),password=String(body.password||''),role=safeText(body.role,20);if(!name||(!username&&!email.includes('@'))||(username&&!/^[a-z0-9._-]{3,24}$/.test(username))||(email&&!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))||password.length<6||password.length>128||!['MEMBER','ADMIN'].includes(role)||role==='OWNER')throw httpError(400,'Dados invalidos. Usuario de 3 a 24 caracteres e senha minima de 6; OWNER nao pode ser criado por este formulario.');if(store.users.some(u=>(username&&u.username===username)||(email&&u.email===email)))throw httpError(409,'Ja existe uma conta com este usuario ou e-mail.');const salt=crypto.randomBytes(16).toString('hex');const passwordHash=(await scrypt(password,salt,64)).toString('hex');if(role!=='MEMBER'&&user.role!=='OWNER')throw httpError(403,'Somente o OWNER pode criar contas administrativas.');const memberId=safeText(body.memberId,80)||null;if(role==='MEMBER'&&(!memberId||!store.members.some(m=>m.id===memberId&&m.status==='ACTIVE')))throw httpError(400,'Associe a conta a um membro ativo.');const created={id:id(),name,username:username||null,email:email||null,role,memberId,permissions:defaultPermissions(role),salt,passwordHash,createdAt:nowISO(),disabled:false};await mutate(()=>{if(store.users.some(u=>(username&&u.username===username)||(email&&u.email===email)))throw httpError(409,'Ja existe uma conta com este usuario ou e-mail.');store.users.push(created);audit(user,'Conta criada',`${username||email} • ${role}`);});return sendJSON(res,201,{ok:true,user:publicUser(created)});}",
              'criacao administrativa de contas compativel com usuario'
          )

          # A confirmacao manual e idempotente: nunca cria um segundo membro para a mesma candidatura/tag.
          server = replace_once(
              server,
              "if(app.status!=='AWAITING_WHATSAPP')throw httpError(409,'A candidatura precisa estar aguardando confirmação do WhatsApp.');\n        const brawler=rosterEntry(app.desiredBrawlerId??app.desiredBrawlerKey);",
              "if(app.status!=='AWAITING_WHATSAPP')throw httpError(409,'A candidatura precisa estar aguardando confirmação do WhatsApp.');\n        if(store.members.some(m=>m.applicationId===app.id||((cleanTag(m.playerTag)===cleanTag(app.playerTag))&&m.status==='ACTIVE')))throw httpError(409,'Ja existe um membro ativo vinculado a esta candidatura ou tag. Nenhum cadastro duplicado foi criado.');\n        const brawler=rosterEntry(app.desiredBrawlerId??app.desiredBrawlerKey);",
              'protecao contra duplicidade antes da ativacao'
          )
          server = replace_once(
              server,
              "if(app.status!=='AWAITING_WHATSAPP'||brawlerState(brawler.key)!=='RESERVED')throw httpError(409,'A candidatura ou a reserva mudou durante a ativação. Recarregue a lista.');\n          app.status='ACTIVE';",
              "if(app.status!=='AWAITING_WHATSAPP'||brawlerState(brawler.key)!=='RESERVED')throw httpError(409,'A candidatura ou a reserva mudou durante a ativação. Recarregue a lista.');\n          if(store.members.some(m=>m.applicationId===app.id||((cleanTag(m.playerTag)===cleanTag(app.playerTag))&&m.status==='ACTIVE')))throw httpError(409,'A tag ja foi ativada em outra operacao. Recarregue a lista antes de tentar novamente.');\n          app.status='ACTIVE';",
              'protecao transacional contra membro duplicado'
          )

          # Personalizacao de perfil: apenas texto simples, limitado e controlado no servidor.
          server = replace_once(
              server,
              "function publicMember(m){const settings=m.publicProfileSettings||{};return {id:m.id,displayName:m.displayName,gameNickname:store.settings.showNickname&&settings.showNickname!==false?m.gameNickname:null,playerTag:store.settings.showTag&&settings.showTag?m.playerTag:null,representedBrawlerName:m.representedBrawlerName,currentTrophies:m.currentTrophies,baselineTrophies:store.settings.showEvolution&&settings.showEvolution!==false?m.baselineTrophies:null,baselineStatus:m.baselineStatus,joinedAt:m.joinedAt,lastSyncedAt:m.currentTrophiesCapturedAt,apiSyncStatus:m.apiSyncStatus||'PENDING',avatar:m.avatar||null};}",
              "function publicMember(m){const settings=m.publicProfileSettings||{};return {id:m.id,displayName:m.displayName,gameNickname:store.settings.showNickname&&settings.showNickname!==false?m.gameNickname:null,playerTag:store.settings.showTag&&settings.showTag?m.playerTag:null,representedBrawlerName:m.representedBrawlerName,currentTrophies:m.currentTrophies,baselineTrophies:store.settings.showEvolution&&settings.showEvolution!==false?m.baselineTrophies:null,baselineStatus:m.baselineStatus,joinedAt:m.joinedAt,lastSyncedAt:m.currentTrophiesCapturedAt,apiSyncStatus:m.apiSyncStatus||'PENDING',avatar:m.avatar||null,profileTheme:settings.public!==false?(m.profileTheme||'blue'):null,profileTitle:settings.public!==false?(m.profileTitle||null):null,bio:settings.public!==false?(m.bio||null):null};}",
              'campos publicos do perfil personalizavel'
          )
          server = replace_once(
              server,
              "await mutate(()=>{member.displayName=displayName;member.gameNickname=gameNickname;member.publicProfileSettings={...(member.publicProfileSettings||{}),public:body.public===true,showNickname:body.showNickname===true,showTag:body.showTag===true,showEvolution:body.showEvolution===true};audit(user,'Perfil pessoal atualizado',member.displayName);});",
              "await mutate(()=>{member.displayName=displayName;member.gameNickname=gameNickname;member.profileTitle=safeText(body.profileTitle,40);member.bio=safeText(body.bio,180);if(['⭐','🏆','🎮','⚡','🌟','🚀'].includes(body.avatar))member.avatar=body.avatar;if(['blue','purple','gold','green'].includes(body.profileTheme))member.profileTheme=body.profileTheme;member.publicProfileSettings={...(member.publicProfileSettings||{}),public:body.public===true,showNickname:body.showNickname===true,showTag:body.showTag===true,showEvolution:body.showEvolution===true};audit(user,'Perfil pessoal atualizado',member.displayName);});",
              'persistencia dos campos de perfil'
          )

          # Inscricao em evento: permite cancelar a propria presenca.
          server = replace_once(
              server,
              "if(req.method==='POST'&&url.pathname==='/api/member/event-registration'){checkCsrf(req);requirePermission(user,'member.self');const body=await bodyJSON(req);const event=store.events.find(e=>e.id===body.eventId&&e.status==='PUBLISHED');if(!event)throw httpError(404,'Evento não encontrado.');await mutate(()=>{event.registrations=event.registrations||[];if(event.registrations.includes(user.memberId))return;if(event.limit&&event.registrations.length>=event.limit)throw httpError(409,'As vagas deste evento foram preenchidas.');event.registrations.push(user.memberId);audit(user,'Inscrição em evento',event.title);});return sendJSON(res,200,{ok:true});}",
              "if(req.method==='POST'&&url.pathname==='/api/member/event-registration'){checkCsrf(req);requirePermission(user,'member.self');const body=await bodyJSON(req);const event=store.events.find(e=>e.id===body.eventId&&e.status==='PUBLISHED');if(!event)throw httpError(404,'Evento não encontrado.');await mutate(()=>{event.registrations=event.registrations||[];if(event.registrations.includes(user.memberId))return;if(event.limit&&event.registrations.length>=event.limit)throw httpError(409,'As vagas deste evento foram preenchidas.');event.registrations.push(user.memberId);audit(user,'Inscrição em evento',event.title);});return sendJSON(res,200,{ok:true});}\n    if(req.method==='POST'&&url.pathname==='/api/member/event-registration/cancel'){checkCsrf(req);requirePermission(user,'member.self');const body=await bodyJSON(req);const event=store.events.find(e=>e.id===body.eventId&&e.status==='PUBLISHED');if(!event)throw httpError(404,'Evento nao encontrado.');await mutate(()=>{event.registrations=Array.isArray(event.registrations)?event.registrations:[];event.registrations=event.registrations.filter(id=>id!==user.memberId);audit(user,'Cancelamento de inscricao em evento',event.title);});return sendJSON(res,200,{ok:true});}",
              'cancelamento de inscricao em evento'
          )

          # Metas coletivas ficam no documento de configuracoes existente (nenhuma colecao nova).
          server = replace_once(
              server,
              "if(req.method==='GET'&&url.pathname==='/api/public/summary')return sendJSON(res,200,publicSummary());",
              "if(req.method==='GET'&&url.pathname==='/api/public/summary')return sendJSON(res,200,publicSummary());\n    if(req.method==='GET'&&url.pathname==='/api/public/goals'){const active=store.members.filter(m=>m.status==='ACTIVE');const items=(Array.isArray(store.settings.collectiveGoals)?store.settings.collectiveGoals:[]).map(g=>{const current=g.metric==='members'?active.length:(active.length&&active.every(m=>validNumber(m.currentTrophies))?active.reduce((sum,m)=>sum+Number(m.currentTrophies),0):null);return {...g,current,progress:current===null?null:Math.min(100,Math.round(current/Math.max(1,Number(g.target))*100))};});return sendJSON(res,200,{items});}",
