name: Star Park - Atualização da Central do Jogador

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Branch de origem"
        required: true
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: star-park-player-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    name: Aplicar melhorias com segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Criar branch isolada
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="star-park-player-upgrade-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Aplicar atualização visual dos Brawlers do membro
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const appPath = 'public/app.js';
          const cssPath = 'public/styles.css';

          if (!fs.existsSync(appPath) || !fs.existsSync(cssPath)) {
            throw new Error('Estrutura inesperada: public/app.js ou public/styles.css não encontrado.');
          }

          let app = fs.readFileSync(appPath, 'utf8');
          let css = fs.readFileSync(cssPath, 'utf8');

          const marker = '/* STAR_PARK_MEMBER_BRAWLER_CARDS_V1 */';
          if (app.includes(marker)) {
            console.log('A melhoria já está instalada. Nenhuma duplicação será criada.');
            process.exit(0);
          }

          const stateAnchor = 'let roster=[],summary={},members=[]';
          const portalAnchor = 'async function loadMemberPortal(){';
          const collectionAnchor = '<span class="kicker">COLEÇÃO</span><h3>Meus Brawlers</h3>';
          const battlesAnchor = '<span class="kicker">BATALHAS CAPTURADAS</span>';

          if (!app.includes(stateAnchor) || !app.includes(portalAnchor) ||
              !app.includes(collectionAnchor) || !app.includes(battlesAnchor)) {
            throw new Error('O código atual não corresponde à estrutura esperada. Atualização cancelada sem alterar arquivos.');
          }

          const helpers = `
          ${marker}
          let memberBrawlersCache = [];

          function memberBrawlerCardMarkup(b) {
            const catalog = roster.find(x => slugKey(x.name) === slugKey(b.name));
            const image = catalog ? brawlerImageMarkup(catalog, 'member-brawler-character') :
              '<span class="member-brawler-fallback">' + esc(initials(b.name)) + '</span>';
            const rank = b.rank == null ? '—' : String(b.rank);
            const trophies = b.trophies == null ? '—' : fmt(b.trophies);
            const power = b.power == null ? '—' : String(b.power);
            const highest = b.highestTrophies == null ? '—' : fmt(b.highestTrophies);
            const rarity = catalog?.rarity || 'BRAWLER';
            const [c1,c2] = brawlerColor(catalog?.id || b.name?.length || 1);
            const progression = Number.isFinite(Number(b.trophies)) && Number.isFinite(Number(b.highestTrophies)) &&
              Number(b.highestTrophies) > 0
              ? Math.max(0, Math.min(100, Math.round(Number(b.trophies) / Number(b.highestTrophies) * 100)))
              : null;
            const equipment = [
              Array.isArray(b.gadgets) ? b.gadgets.length : null,
              Array.isArray(b.starPowers) ? b.starPowers.length : null,
              Array.isArray(b.gears) ? b.gears.length : null
            ].filter(x => x !== null).reduce((sum,x) => sum + x, 0);
            return \`<article class="member-brawler-card" style="--member-card-a:\${c1};--member-card-b:\${c2}">
              <div class="member-brawler-art">\${image}<span class="member-brawler-rarity">\${esc(rarity)}</span></div>
              <div class="member-brawler-info">
                <div class="member-brawler-title"><b>\${esc(b.name || 'Brawler')}</b><span>RANK \${esc(rank)}</span></div>
                <div class="member-brawler-stats">
                  <span><small>TROFÉUS</small><strong>\${trophies}</strong></span>
                  <span><small>PODER</small><strong>\${esc(power)}</strong></span>
                  <span><small>RECORDE</small><strong>\${highest}</strong></span>
                </div>
                \${progression === null ? '' : \`<div class="member-brawler-progress"><span style="width:\${progression}%"></span></div><small class="member-brawler-progress-label">\${progression}% do recorde pessoal</small>\`}
                <div class="member-brawler-foot"><span>\${equipment ? \`✦ \${equipment} melhoria(s) informada(s)\` : 'Coleção oficial'}</span><span>\${catalog?.class ? esc(catalog.class) : 'Brawl Stars'}</span></div>
              </div>
            </article>\`;
          }

          function memberBrawlerCardsMarkup(items) {
            memberBrawlersCache = Array.isArray(items) ? items.slice() : [];
            return \`<section class="game-panel member-brawler-collection">
              <div class="panel-head"><div><span class="kicker">COLEÇÃO DO JOGADOR</span><h3>Meus Brawlers</h3></div><span class="count-bubble">\${fmt(memberBrawlersCache.length)}</span></div>
              <div class="member-brawler-toolbar">
                <label class="search-control"><span>⌕</span><input id="memberBrawlerSearch" type="search" placeholder="Buscar Brawler..." aria-label="Buscar Brawler na coleção"></label>
                <select id="memberBrawlerSort" aria-label="Ordenar coleção">
                  <option value="trophies">Mais troféus</option>
                  <option value="rank">Maior rank</option>
                  <option value="power">Maior poder</option>
                  <option value="name">Nome A–Z</option>
                </select>
              </div>
              <div id="memberBrawlerGrid" class="member-brawler-grid">
                \${memberBrawlersCache.length ? memberBrawlersCache.slice().sort((a,b)=>(Number(b.trophies)||0)-(Number(a.trophies)||0)).map(memberBrawlerCardMarkup).join('') : '<div class="empty-box">Aguarde a primeira consulta oficial do perfil.</div>'}
              </div>
              <p class="footnote">Troféus, poder, rank e recordes são exibidos conforme os campos realmente retornados pelo perfil oficial. Campos ausentes permanecem como indisponíveis.</p>
            </section>\`;
          }

          function renderMemberBrawlerCards() {
            const host = document.querySelector('#memberBrawlerGrid');
            if (!host) return;
            const term = (document.querySelector('#memberBrawlerSearch')?.value || '').trim().toLocaleLowerCase('pt-BR');
            const sort = document.querySelector('#memberBrawlerSort')?.value || 'trophies';
            const list = memberBrawlersCache.filter(b => String(b.name || '').toLocaleLowerCase('pt-BR').includes(term));
            list.sort((a,b) => {
              if (sort === 'name') return String(a.name || '').localeCompare(String(b.name || ''), 'pt-BR');
              const field = sort === 'rank' ? 'rank' : sort === 'power' ? 'power' : 'trophies';
              return (Number(b[field]) || -1) - (Number(a[field]) || -1);
            });
            host.innerHTML = list.length
              ? list.map(memberBrawlerCardMarkup).join('')
              : '<div class="empty-box" style="grid-column:1/-1">Nenhum Brawler encontrado com esse filtro.</div>';
          }

          document.addEventListener('input', event => {
            if (event.target?.id === 'memberBrawlerSearch') renderMemberBrawlerCards();
          });
          document.addEventListener('change', event => {
            if (event.target?.id === 'memberBrawlerSort') renderMemberBrawlerCards();
          });
          `;

          app = app.replace(portalAnchor, helpers + '\n' + portalAnchor);

          const start = app.indexOf(collectionAnchor);
          const end = app.indexOf(battlesAnchor, start);
          if (start < 0 || end < 0) {
            throw new Error('Não foi possível localizar com segurança o bloco da coleção. Nenhuma alteração será publicada.');
          }
          const blockStart = app.lastIndexOf('<div class="game-panel"', start);
          const blockEnd = app.lastIndexOf('</div>', end);
          if (blockStart < 0 || blockEnd < blockStart) {
            throw new Error('Limites do bloco de coleção não puderam ser validados.');
          }
          const nextPanel = app.lastIndexOf('<div class="game-panel"', end);
          if (nextPanel < blockStart) throw new Error('Bloco de batalhas não localizado.');
          app = app.slice(0, blockStart) +
            '${memberBrawlerCardsMarkup(m.brawlers||[])}\n   ' +
            app.slice(nextPanel);

          const cssMarker = '/* STAR_PARK_MEMBER_BRAWLER_CARDS_V1 */';
          if (!css.includes(cssMarker)) {
            css += `

          ${cssMarker}
          .member-brawler-collection{grid-column:1/-1;min-width:0}
          .member-brawler-toolbar{display:grid;grid-template-columns:minmax(180px,1fr) minmax(150px,220px);gap:10px;margin:4px 0 16px}
          .member-brawler-toolbar select{min-height:42px;border:2px solid var(--outline);border-radius:10px;background:#fff;padding:0 12px;color:var(--ink);font:800 10px 'DM Sans',sans-serif}
          .member-brawler-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
          .member-brawler-card{display:grid;grid-template-columns:92px minmax(0,1fr);gap:11px;min-width:0;padding:10px;border:2px solid var(--outline);border-radius:15px;background:linear-gradient(135deg,#fff 0%,#f5faff 100%);box-shadow:0 3px 0 #14243e24;overflow:hidden}
          .member-brawler-art{position:relative;display:grid;place-items:center;min-height:120px;border:2px solid var(--outline);border-radius:11px;background:radial-gradient(circle at 50% 35%,#fff9,transparent 55%),linear-gradient(145deg,var(--member-card-a),var(--member-card-b));overflow:hidden}
          .member-brawler-art:after{content:'✦';position:absolute;right:5px;top:3px;color:#fff9;font-size:19px}
          .member-brawler-character{width:100%;height:112px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 3px 0 #10213a55)}
          .member-brawler-fallback{display:grid;place-items:center;width:58px;height:58px;border:3px solid var(--outline);border-radius:18px;background:#fff;color:var(--ink);font:900 19px 'Lilita One',sans-serif}
          .member-brawler-rarity{position:absolute;z-index:2;left:4px;right:4px;bottom:4px;padding:4px 2px;border:1px solid #14243e;border-radius:6px;background:#fffE;color:var(--ink);font-size:7px;font-weight:1000;text-align:center;text-transform:uppercase;letter-spacing:.3px}
          .member-brawler-info{min-width:0;display:flex;flex-direction:column;justify-content:center}
          .member-brawler-title{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:9px}
          .member-brawler-title>b{min-width:0;color:var(--ink);font:400 18px 'Lilita One',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .member-brawler-title>span{flex:none;padding:4px 6px;border:1px solid var(--outline);border-radius:6px;background:#ffda4c;color:var(--ink);font-size:7px;font-weight:1000}
          .member-brawler-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
          .member-brawler-stats>span{min-width:0;padding:6px 5px;border:1px solid #d6e5ef;border-radius:7px;background:#fff}
          .member-brawler-stats small{display:block;color:#68829d;font-size:6px;font-weight:1000;letter-spacing:.4px}
          .member-brawler-stats strong{display:block;margin-top:3px;color:var(--ink);font:900 12px 'Space Grotesk',sans-serif;overflow:hidden;text-overflow:ellipsis}
          .member-brawler-progress{height:6px;margin-top:9px;border:1px solid #14243e;border-radius:10px;background:#e5edf4;overflow:hidden}
          .member-brawler-progress span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#45c69a,#1686e7)}
          .member-brawler-progress-label{display:block;margin-top:3px;color:#68829d;font-size:7px;font-weight:800}
          .member-brawler-foot{display:flex;justify-content:space-between;gap:5px;margin-top:8px;color:#68829d;font-size:7px;font-weight:800}
          .member-brawler-foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          @media(max-width:620px){.member-brawler-toolbar{grid-template-columns:1fr}.member-brawler-grid{grid-template-columns:1fr}.member-brawler-card{grid-template-columns:84px minmax(0,1fr)}}
          `;
          }

          fs.writeFileSync(appPath, app);
          fs.writeFileSync(cssPath, css);
          console.log('Coleção visual de Brawlers atualizada com sucesso.');
          NODE

      - name: Instalar dependências e executar testes
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm test

      - name: Verificar alterações
        shell: bash
        run: |
          set -euo pipefail
          node --check public/app.js
          git diff --check
          git diff --stat
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi

      - name: Publicar branch e abrir Pull Request
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Sem alterações para publicar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/styles.css
          git commit -m "feat: melhorar coleção visual de Brawlers do membro"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "Star Park: coleção visual de Brawlers na Central do Jogador" \
            --body "## O que muda\n- Troca a lista textual de Brawlers por cartões visuais com retrato, raridade, troféus, poder, rank e recorde.\n- Adiciona busca e ordenação à coleção pessoal.\n- Mantém dados ausentes como indisponíveis e preserva o histórico de partidas.\n- Preserva a identidade visual existente da Star Park.\n\n## Segurança\n- Alterações isoladas em branch.\n- Testes do projeto, verificação de sintaxe e git diff --check executados antes da publicação.\n- Nenhuma alteração é aplicada diretamente à main."
