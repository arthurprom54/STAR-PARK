name: Corrigir workflow STAR PARK 6.0.0 (robusto)

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corrigir-star-park-6-0-0
  cancel-in-progress: false

jobs:
  corrigir:
    name: Corrigir instalador 6.0.0 por substituição robusta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corrigir funções do instalador sem depender de indentação exata
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET='.github/workflows/star-park-6-mega-atualizacao(1).yml'
          test -f "$TARGET" || { echo "Arquivo não encontrado: $TARGET"; exit 1; }
          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          pattern_once=r'(?ms)^\s{10}def replace_once\(path, old, new, label, expected=1\):\n.*?(?=^\s{10}def replace_line\()'
          replacement_once='''          def replace_once(path, old, new, label, expected=1):
              source = read(path)
              count = source.count(old)
              if count == 0:
                  if not new or new in source:
                      print(f"OK já aplicado: {label}")
                      return
                  raise SystemExit(f"ABORTADO — {label}: marcador antigo e novo ausentes em {path}.")
              if count != expected:
                  raise SystemExit(f"ABORTADO — {label}: esperado(s) {expected}, encontrado(s) {count} em {path}.")
              write(path, source.replace(old, new, expected))
              print(f"OK aplicado: {label}")

          '''
          pattern_regex=r'(?ms)^\s{10}def replace_regex\(path, pattern, replacement, label, flags=0\):\n.*?(?=^\s{10}# -{10,})'
          replacement_regex='''          def replace_regex(path, pattern, replacement, label, flags=0):
              source = read(path)
              compiled = re.compile(pattern, flags)
              if not compiled.search(source):
                  if replacement in source:
                      print(f"OK já aplicado: {label}")
                      return
                  raise SystemExit(f"ABORTADO — {label}: marcador antigo e novo ausentes em {path}.")
              updated, count = compiled.subn(lambda _m: replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f"ABORTADO — {label}: padrão encontrado {count} vez(es) em {path}.")
              write(path, updated)
              print(f"OK aplicado: {label}")

          '''
          m1=list(re.finditer(pattern_once,s)); m2=list(re.finditer(pattern_regex,s))
          if len(m1)!=1 or len(m2)!=1:
              raise SystemExit(f"Falha de detecção flexível: replace_once={len(m1)}, replace_regex={len(m2)}; nada alterado.")
          s=s[:m1[0].start()]+replacement_once+s[m1[0].end():]
          m2=list(re.finditer(pattern_regex,s))
          if len(m2)!=1: raise SystemExit('Não foi possível localizar replace_regex após a correção.')
          s=s[:m2[0].start()]+replacement_regex+s[m2[0].end():]
          if 'if count == 0:' not in s or 'compiled = re.compile(pattern, flags)' not in s:
              raise SystemExit('Verificação final não passou.')
          p.write_text(s,encoding='utf-8',newline='\n')
          print('OK funções corrigidas usando limites de função, não texto/indentação literal.')
          PY

      - name: Validar e commit somente se houve mudança
        shell: bash
        run: |
          set -Eeuo pipefail
          TARGET='.github/workflows/star-park-6-mega-atualizacao(1).yml'
          grep -Fq 'if count == 0:' "$TARGET"
          grep -Fq 'compiled = re.compile(pattern, flags)' "$TARGET"
          git diff --check
          git add -- "$TARGET"
          if git diff --cached --quiet; then echo 'Correção já está aplicada.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(actions): robustamente corrigir patches Star Park 6.0.0'
          git push origin HEAD:main
          echo 'Correção registrada.'
          
