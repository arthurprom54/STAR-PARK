          )

          css_addition = '/* STAR PARK 6.0.0 — acessibilidade, espaços, gráficos e confirmação */\n.btn,.btn-block{min-height:48px;font-size:14px;line-height:1.25;padding:12px 18px;letter-spacing:.25px}\n.mini-action{min-height:40px;font-size:12px;line-height:1.2;padding:9px 12px;white-space:normal}\n.nav-item{min-height:46px;font-size:12px;padding-top:11px;padding-bottom:11px}\nbutton,select,input,textarea{touch-action:manipulation}\nbutton:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f2b91e;outline-offset:3px}\n.sp-workspace-switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 16px;padding:0 12px}\n.sp-workspace-button{min-width:0;min-height:42px;border:1px solid #c9d9e9;border-radius:10px;background:#f5f9fd;color:#20344c;font-size:10px;font-weight:900;letter-spacing:.35px;padding:8px 5px;cursor:pointer}\n.sp-workspace-button span{display:block;font-size:15px;margin-bottom:2px}\n.sp-workspace-button.active{background:#142e4b;color:#fff;border-color:#142e4b;box-shadow:0 2px 0 #0b1d32}\n.sp-application-confirmation{width:min(760px,100%);margin:0 auto;padding:clamp(22px,5vw,42px);border:2px solid #31a879;border-radius:22px;background:linear-gradient(150deg,#f2fff8,#fff);color:#17324a;text-align:center;box-shadow:0 12px 34px #12324a12}\n.sp-confirm-icon{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:#d9f8e9;color:#13865a;font-size:36px;font-weight:900}\n.sp-application-confirmation h2{margin:8px 0 14px;font-size:clamp(25px,4vw,36px);line-height:1.1}\n.sp-application-confirmation p{max-width:600px;margin:10px auto;color:#52697d;line-height:1.6}\n.sp-confirm-protocol{padding:10px;border-radius:10px;background:#edf5fb;color:#263f57}\n.sp-whatsapp-cta{display:flex;align-items:center;justify-content:center;min-height:58px;margin:22px auto 12px;padding:14px 20px;border:2px solid #087d4c;border-radius:13px;background:#20c66c;color:#063e28;font-size:15px;font-weight:1000;line-height:1.3;text-decoration:none;box-shadow:0 4px 0 #087d4c}\n.sp-whatsapp-cta:focus-visible{outline:3px solid #f2b91e;outline-offset:4px}\n.sp-application-confirmation>small{display:block;color:#688096;line-height:1.5}\n.sp-analytics-panel{margin:20px 0;padding:clamp(14px,3vw,22px);border:1px solid #d6e4ef;border-radius:18px;background:#f6faff;color:#18334e}\n.sp-analytics-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}\n.sp-analytics-heading h2{margin:4px 0;font-size:clamp(20px,3vw,27px)}\n.sp-analytics-heading>small{max-width:330px;color:#6a8197;line-height:1.45}\n.sp-analytics-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}\n.sp-chart-card{min-width:0;padding:16px;border:1px solid #dbe7f0;border-radius:14px;background:#fff}\n.sp-chart-card h3{margin:0 0 4px;font-size:15px}\n.sp-chart-card>p{margin:0 0 14px;color:#71869a;font-size:11px;line-height:1.45}\n.sp-chart-row{display:grid;grid-template-columns:minmax(70px,110px) minmax(40px,1fr) 28px;align-items:center;gap:8px;margin:9px 0;font-size:11px}\n.sp-chart-row>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#526b82}\n.sp-chart-track{height:10px;overflow:hidden;border-radius:20px;background:#e9f0f6}\n.sp-chart-track i{display:block;height:100%;min-width:0;border-radius:20px;background:linear-gradient(90deg,#1b8bd6,#32bb91)}\n.sp-chart-row>b{text-align:right;font-variant-numeric:tabular-nums}\n.sp-chart-empty{padding:18px 8px;border:1px dashed #ccdce8;border-radius:10px;color:#71869a;text-align:center;font-size:12px}\n.sp-identity-link-panel{margin-top:14px;padding:18px}\n.sp-identity-link-panel>p{max-width:720px;color:#647b91;line-height:1.55}\n.sp-identity-link-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}\n.sp-identity-link-form label{display:grid;gap:6px;color:#3e566e;font-size:12px;font-weight:700}\n.sp-identity-link-form label:nth-child(3){grid-column:1/-1}\n.sp-identity-link-form button{grid-column:1/-1;justify-self:start}\n.sp-tag-preview{font-size:13px;line-height:1.45}\n.application-avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}\n.application-api-details{margin-top:7px;padding:8px 10px;border-radius:9px;background:#f2f7fb;color:#3e566e}\n.application-api-details summary{font-size:10px;font-weight:900;cursor:pointer}\n.application-api-details small{display:block;margin-top:5px;line-height:1.5}\n@media(max-width:720px){.sp-analytics-grid{grid-template-columns:1fr}.sp-analytics-heading{align-items:flex-start;flex-direction:column}.sp-identity-link-form{grid-template-columns:1fr}.sp-identity-link-form label:nth-child(3),.sp-identity-link-form button{grid-column:auto}.sp-workspace-switch{padding:0 8px}.sp-workspace-button{font-size:9px}.sp-whatsapp-cta{font-size:13px}}'
          replace_once(
              "public/starpark-next.css",
              "/* STAR PARK NEXT - estilos responsivos incrementais */",
              "/* STAR PARK NEXT - estilos responsivos incrementais */\n" + css_addition,
              "melhorar tamanhos de botões, mobile, gráficos e confirmação",
          )

          # ------------------------------------------------------------
          # 11. Versão e documentação
          # ------------------------------------------------------------
          package = json.loads(read("package.json"))
          if package.get("version") != "5.1.0":
              raise SystemExit(f"Versão-base inesperada no package.json: {package.get('version')}")
          package["version"] = "6.0.0"
          write("package.json", json.dumps(package, ensure_ascii=False, indent=2) + "\n")
          replace_once("server.mjs", "const APP_VERSION = '5.1.0';", "const APP_VERSION = '6.0.0';", "atualizar versão exibida no health check")
          readme = read("README.md")
          heading = "\n## STAR PARK 6.0.0 — Mega atualização integrada\n\n- Candidaturas novas começam em `PENDING`; a confirmação de WhatsApp exige aprovação administrativa registrada no histórico.\n- Solicitação e aprovação de conta de membro continuam em fluxo separado e exigem membro ativo vinculado a candidatura aprovada. Membros já ativados pelo fluxo anterior têm a aprovação histórica preservada na migração.\n- Identidades podem reunir permissões `ADMIN`/`OWNER` e `MEMBER`; uma conta administrativa pode ser vinculada a um perfil, preservando e desativando com auditoria a conta de membro antiga quando houver consolidação.\n- Correção de tag consulta novamente a API, exige confirmação do nickname retornado, arquiva o contexto anterior e reinicia as estatísticas para não misturar jogadores.\n- A confirmação de candidatura substitui o formulário por uma tela com protocolo e link do WhatsApp.\n- Indicadores administrativos usam dados atuais de candidaturas, troféus, sincronização e Brawlers; estados sem dados ficam vazios, sem valores fictícios.\n- Perfis de Brawlers preservam gadgets, poderes e equipamentos somente quando esses campos estão presentes na resposta oficial.\n- As áreas, eventos, anúncios, rankings, catálogo, sincronização, auditoria e recursos existentes são mantidos.\n"
          if "## STAR PARK 6.0.0 — Mega atualização integrada" not in readme:
              write("README.md", readme.rstrip() + "\n" + heading)
          print("Atualização 6.0.0 aplicada ao código-fonte.")
          PY
          python3 /tmp/apply-starpark-6.py

      - name: Validar sintaxe, HTML, CSS, versão e fluxo de segurança
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check server.mjs
          node --check public/app.js
          node --check public/starpark-next.js
          node --check lib/star-park-domain.mjs
          node --check tests/auth.test.mjs
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          class CheckHTML(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)

          for filename in ['public/index.html']:
              parser=CheckHTML()
              parser.feed(Path(filename).read_text(encoding='utf-8'))
              parser.close()
          for filename in ['public/styles.css','public/starpark-next.css']:
              css=Path(filename).read_text(encoding='utf-8')
              if css.count('{') != css.count('}'):
                  raise SystemExit(f'CSS com chaves desbalanceadas: {filename}')
          package=json.loads(Path('package.json').read_text(encoding='utf-8'))
          if package.get('version')!='6.0.0':
              raise SystemExit('package.json não está em 6.0.0')
          server=Path('server.mjs').read_text(encoding='utf-8')
          app=Path('public/app.js').read_text(encoding='utf-8')
          html=Path('public/index.html').read_text(encoding='utf-8')
          extra=Path('public/starpark-next.js').read_text(encoding='utf-8')
          auth_test=Path('tests/auth.test.mjs').read_text(encoding='utf-8')
          checks={
            'candidatura inicia em PENDING': "motivation,status:'PENDING'" in server,
            'ativação exige aprovação': "!applicationWasApproved(app)" in server,
            'membros antigos ativos preservam elegibilidade': 'legacyActivatedApplications' in server,
            'conta exige candidatura aprovada': 'memberAccountEligible(member,store.applications)' in server,
            'checkbox removido do recrutamento': 'name="wantsMemberAccount"' not in html,
            'formulário não envia preferência antiga': 'body.wantsMemberAccount' not in app,
            'conta separada permanece': '/api/member/account-requests' in server and 'memberAccountRequestForm' in html,
            'troca de espaços presente': 'starParkSelectWorkspace' in app and 'spWorkspaceSwitch' in extra,
            'consolidação de conta presente': 'link-member' in server and 'spIdentityLinkForm' in extra,
            'correção de tag presente': 'player-tag' in server and 'data-correct-player-tag' in app,
            'gráficos administrativos presentes': 'spAdminAnalytics' in extra,
            'dados reais da API preservados na candidatura': 'playerStatsAtApplication' in server and 'clubAtApplication' in server,
            'candidato exibe Brawler e estatísticas': 'application-avatar' in app and 'application-api-details' in app,
            'moderador mantém acesso administrativo': "roles.some(item=>['OWNER','MODERATOR'].includes(item))" in app,
            'teste de integração percorre aprovação e WhatsApp': "for(const status of ['IN_REVIEW','APPROVED','AWAITING_WHATSAPP'])" in auth_test,
            'tela de confirmação substitui formulário': 'spApplicationConfirmation' in extra,
            'teste de regressão criado': Path('tests/star-park-domain.test.mjs').is_file(),
          }
          for label,ok in checks.items(): print(('OK ' if ok else 'FALHOU ')+label)
          failed=[label for label,ok in checks.items() if not ok]
          if failed: raise SystemExit('Falhas na validação: '+', '.join(failed))
          print('Validação estrutural concluída.')
          PY

      - name: Instalar dependências e executar todos os testes
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm test

      - name: Conferir diferenças e bloquear alterações inesperadas
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          python3 - <<'PY'
          import json, subprocess
          before=json.loads(subprocess.check_output(['git','show','HEAD:package.json'],text=True))
          after=json.load(open('package.json',encoding='utf-8'))
          before['version']='6.0.0'
          if after!=before: raise SystemExit('package.json teve alterações além da versão.')
          changed=set(subprocess.check_output(['git','status','--short'],text=True).splitlines())
          allowed_prefixes=(' M README.md',' M server.mjs',' M public/',' M package.json','?? lib/star-park-domain.mjs','?? tests/star-park-domain.test.mjs',' M tests/auth.test.mjs')
          unexpected=[line for line in changed if not line.startswith(allowed_prefixes)]
          if unexpected: raise SystemExit('Arquivos inesperados modificados: '+repr(unexpected))
          PY
          git status --short
          git diff --stat

      - name: Instalar no GitHub somente após todos os testes passarem
        if: steps.guard.outputs.already != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git add package.json README.md server.mjs public/index.html public/app.js public/starpark-next.js public/starpark-next.css lib/star-park-domain.mjs tests/star-park-domain.test.mjs tests/auth.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para instalar."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat(star-park): mega atualização integrada 6.0.0"
          git push origin HEAD:main
          echo "Versão 6.0.0 publicada na main após validação."

      - name: Resumo da execução
        if: always()
        shell: bash
        run: |
          {
            echo "## STAR PARK 6.0.0 — Mega atualização integrada"
            echo "- Resultado do job: ${{ job.status }}"
            echo "- Candidaturas exigem aprovação registrada antes da ativação e do acesso de membro."
            echo "- Solicitações de conta e sua fila administrativa foram preservadas."
            echo "- Backup do código-fonte: artefato com retenção de 30 dias (quando a instalação foi necessária)."
            echo "- O código só é enviado à main depois de node --check, validações estruturais e npm test."
            echo "- O job não grava diretamente no Firestore. Na primeira inicialização da versão 6.0.0, o servidor executa uma migração idempotente de candidaturas antigas em lotes e registra auditoria."
            echo "- O backup de 30 dias cobre o código-fonte, não os dados Firestore. Faça um backup do Firestore antes de executar a atualização."
          } >> "$GITHUB_STEP_SUMMARY"
