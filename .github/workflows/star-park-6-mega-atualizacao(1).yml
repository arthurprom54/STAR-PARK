name: STAR PARK 6.0.0 — Mega atualização integrada

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-park-6-mega-atualizacao
  cancel-in-progress: false

jobs:
  atualizar:
    name: Backup, correções, testes e instalação da versão 6.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar o código da branch principal
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Conferir a versão-base e os arquivos essenciais
        id: guard
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Execute este workflow selecionando a branch main."
            exit 1
          fi
          node -e "const p=require('./package.json'); if(!['5.1.0','6.0.0'].includes(p.version)) { console.error('Versão-base inesperada:',p.version); process.exit(1) }"
          for file in package.json server.mjs public/index.html public/app.js public/styles.css public/starpark-next.js public/starpark-next.css lib/firestore-store.mjs; do
            test -f "$file" || { echo "Arquivo essencial ausente: $file"; exit 1; }
          done
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "6.0.0" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "A versão 6.0.0 já está declarada. O workflow fará somente as verificações de integridade."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Base 5.1.0 confirmada. Será aplicada a atualização 6.0.0."
          fi

      - name: Criar backup do código antes de alterar
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if git ls-files | grep -E '(^|/)(\.env|serviceAccountKey\.json|firebase-service-account[^/]*\.json|.*\.pem)$' > /tmp/starpark-sensitive.txt; then
            echo "Foram encontrados arquivos sensíveis versionados; o backup foi interrompido por segurança."
            cat /tmp/starpark-sensitive.txt
            exit 1
          fi
          mkdir -p /tmp/starpark-backup
          tar -czf /tmp/starpark-backup/star-park-source-before-6.0.0.tar.gz \
            package.json README.md server.mjs public lib tests scripts firestore.rules docs .github/workflows
          sha256sum /tmp/starpark-backup/star-park-source-before-6.0.0.tar.gz

      - name: Guardar backup para recuperação
        if: steps.guard.outputs.already != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: star-park-backup-antes-da-6.0.0-${{ github.run_number }}
          path: /tmp/starpark-backup/star-park-source-before-6.0.0.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Aplicar a atualização integrada com marcadores estritos
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/apply-starpark-6.py <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path.cwd()

          def read(path):
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path, content):
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8", newline="\n")

          def replace_once(path, old, new, label, expected=1):
              source = read(path)
              if new and new in source:
                  print(f"OK já aplicado: {label}")
                  return
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f"ABORTADO — {label}: esperado(s) {expected} marcador(es), encontrado(s) {count} em {path}.")
              write(path, source.replace(old, new, expected))
              print(f"OK aplicado: {label}")

          def replace_line(path, prefix, replacement, label):
              source = read(path)
              lines = source.splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) == 0 and replacement in source:
                  print(f"OK já aplicado: {label}")
                  return
              if len(matches) != 1:
                  raise SystemExit(f"ABORTADO — {label}: marcador de linha encontrado {len(matches)} vez(es) em {path}.")
              lines[matches[0]:matches[0] + 1] = replacement.splitlines()
              write(path, "\n".join(lines) + "\n")
              print(f"OK aplicado: {label}")

          def replace_regex(path, pattern, replacement, label, flags=0):
              source = read(path)
              if replacement in source:
                  print(f"OK já aplicado: {label}")
                  return
              updated, count = re.subn(pattern, lambda _m: replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"ABORTADO — {label}: padrão encontrado {count} vez(es) em {path}.")
              write(path, updated)
              print(f"OK aplicado: {label}")

          # ------------------------------------------------------------
          # 1. Regras de domínio testáveis: aprovação real + identidade múltipla
          # ------------------------------------------------------------
          domain = r'''export function normalizePlayerTag(value) {
            return String(value ?? '').replace(/^#/, '').replace(/\s+/g, '').toUpperCase();
          }

          export function applicationWasApproved(application) {
            if (!Array.isArray(application?.history)) return false;
            const finalDecision = application.history.slice().reverse().find(entry => ['APPROVED', 'REJECTED', 'CANCELLED'].includes(entry?.status));
            return finalDecision?.status === 'APPROVED';
          }

          export function memberAccountEligible(member, applications) {
            if (!member || member.status !== 'ACTIVE' || !member.applicationId || !Array.isArray(applications)) return false;
            const application = applications.find(item => item?.id === member.applicationId);
            if (!application || application.status !== 'ACTIVE' || !applicationWasApproved(application)) return false;
            const originalTag = normalizePlayerTag(application.playerTag);
            const acceptedTags = new Set([
              normalizePlayerTag(member.playerTag),
              ...(Array.isArray(member.previousPlayerTags) ? member.previousPlayerTags.map(normalizePlayerTag) : []),
              ...(Array.isArray(member.tagHistory) ? member.tagHistory.map(item => normalizePlayerTag(item?.playerTag)) : []),
            ].filter(Boolean));
            return Boolean(originalTag && acceptedTags.has(originalTag));
          }

          export function accountRoles(user) {
            const roles = new Set(Array.isArray(user?.roles) ? user.roles : []);
            if (user?.role) roles.add(user.role);
            if (user?.memberId) roles.add('MEMBER');
            return [...roles];
          }
          '''
          write("lib/star-park-domain.mjs", domain)

          tests = r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import { applicationWasApproved, memberAccountEligible, accountRoles } from '../lib/star-park-domain.mjs';

          const approvedApplication = {
            id: 'app-1', playerTag: '#ABC123', status: 'ACTIVE',
            history: [{ status: 'PENDING' }, { status: 'IN_REVIEW' }, { status: 'APPROVED' }, { status: 'AWAITING_WHATSAPP' }],
          };
          const activeMember = { id: 'mem-1', applicationId: 'app-1', playerTag: 'ABC123', status: 'ACTIVE' };

          test('somente histórico com aprovação explícita conta como candidatura aprovada', () => {
            assert.equal(applicationWasApproved(approvedApplication), true);
            assert.equal(applicationWasApproved({ status: 'AWAITING_WHATSAPP', history: [{ status: 'PENDING' }] }), false);
            assert.equal(applicationWasApproved({ status: 'ACTIVE', history: [{ status: 'ACTIVE' }] }), false);
            assert.equal(applicationWasApproved({ status: 'REJECTED', history: [{ status: 'APPROVED' }, { status: 'REJECTED' }] }), false);
          });

          test('solicitação de conta exige membro ativo, candidatura vinculada e aprovada', () => {
            assert.equal(memberAccountEligible(activeMember, [approvedApplication]), true);
            assert.equal(memberAccountEligible({ ...activeMember, status: 'SUSPENDED' }, [approvedApplication]), false);
            assert.equal(memberAccountEligible({ ...activeMember, applicationId: null }, [approvedApplication]), false);
            assert.equal(memberAccountEligible(activeMember, [{ ...approvedApplication, history: [{ status: 'PENDING' }] }]), false);
            assert.equal(memberAccountEligible(activeMember, [{ ...approvedApplication, status: 'AWAITING_WHATSAPP' }]), false);
            assert.equal(memberAccountEligible(activeMember, [{ ...approvedApplication, status: 'REJECTED' }]), false);
          });

          test('correção de tag não rompe o vínculo com a candidatura original', () => {
            const corrected = { ...activeMember, playerTag: 'NEW999', previousPlayerTags: ['ABC123'] };
            assert.equal(memberAccountEligible(corrected, [approvedApplication]), true);
            assert.equal(memberAccountEligible({ ...corrected, previousPlayerTags: [] }, [approvedApplication]), false);
          });

          test('uma conta administrativa vinculada recebe também o papel de membro', () => {
            assert.deepEqual(accountRoles({ role: 'ADMIN', memberId: 'mem-1' }), ['ADMIN', 'MEMBER']);
            assert.deepEqual(accountRoles({ role: 'MEMBER', memberId: 'mem-1' }), ['MEMBER']);
            assert.deepEqual(accountRoles({ role: 'OWNER' }), ['OWNER']);
          });
          '''
          write("tests/star-park-domain.test.mjs", tests)

          auth_test = r'''test('OWNER autentica, envia candidatura, aprova, confirma WhatsApp e cria membro',async()=>{
           const login=await request('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:ownerEmail,password:ownerPassword})});assert.equal(login.status,200);ownerCookies=login.headers.getSetCookie();assert.ok(ownerCookies.some(c=>c.startsWith('sp_session=')));csrf=ownerCookies.find(c=>c.startsWith('sp_csrf='))?.split(';')[0].split('=')[1];assert.ok(csrf);
           const session=await request('/api/session',{headers:{cookie:cookieHeader(ownerCookies)}});assert.equal((await session.json()).user.role,'OWNER');
           const submitted=await request('/api/applications',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({displayName:'Membro de Teste',gameNickname:'Tester',playerTag:'PYLQG',ageRange:'18-24',phone:'+5511999999999',phoneType:'self',desiredBrawlerId:'shelly',privacyAcknowledged:true})});assert.equal(submitted.status,201);const application=await submitted.json();assert.equal(application.status,'PENDING');
           const early=await request('/api/member/account-requests',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerTag:'#PYLQG',email:'early@example.test',password:'StrongEarlyPass!2026'})});assert.equal(early.status,409,'conta não pode ser solicitada antes de aprovação e ativação');
           for(const status of ['IN_REVIEW','APPROVED','AWAITING_WHATSAPP']){const transition=await request(`/api/admin/applications/${application.applicationId}/transition`,{method:'POST',headers:{'content-type':'application/json','cookie':cookieHeader(ownerCookies),'x-csrf-token':decodeURIComponent(csrf)},body:JSON.stringify({status,reason:'Teste automatizado do fluxo de recrutamento.'})});assert.equal(transition.status,200,`falha ao avançar para ${status}`);}
           const activation=await request(`/api/admin/applications/${application.applicationId}/confirm-whatsapp`,{method:'POST',headers:{'content-type':'application/json','cookie':cookieHeader(ownerCookies),'x-csrf-token':decodeURIComponent(csrf)},body:'{}'});assert.equal(activation.status,200);memberId=(await activation.json()).memberId;
          });'''
          replace_line(
              "tests/auth.test.mjs",
              "test('OWNER autentica, recebe sessão e cria membro'",
              auth_test,
              "atualizar teste de integração para exigir aprovação e confirmação de WhatsApp",
          )

          # ------------------------------------------------------------
          # 2. Backend: papéis combinados, permissões e brawlers sem inventar dados
          # ------------------------------------------------------------
          replace_once(
              "server.mjs",
              "import {aggregateBattleStats, extractBattleRecords, normalizePlayerStats} from './lib/brawl-stats.mjs';",
              "import {aggregateBattleStats, extractBattleRecords, normalizePlayerStats} from './lib/brawl-stats.mjs';\nimport {applicationWasApproved, memberAccountEligible, accountRoles} from './lib/star-park-domain.mjs';",
              "importar regras de domínio",
          )
          replace_once(
              "server.mjs",
              "function hasPermission(user, permission){return Boolean(user && (user.role==='OWNER' || (user.permissions||rolePermissions[user.role]||[]).includes('*') || (user.permissions||rolePermissions[user.role]||[]).includes(permission)));}",
              "function hasPermission(user, permission){const roles=accountRoles(user);const granted=user?.permissions||rolePermissions[user?.role]||[];return Boolean(user&&(roles.includes('OWNER')||granted.includes('*')||granted.includes(permission)||(permission==='member.self'&&roles.includes('MEMBER'))));}",
              "permissões baseadas em todos os papéis da identidade",
          )
          replace_once(
              "server.mjs",
              "function publicUser(user){return {id:user.id,name:user.name,username:user.username||null,email:user.email||null,role:user.role,permissions:user.permissions||rolePermissions[user.role]||[],createdAt:user.createdAt};}",
              "function publicUser(user){const roles=accountRoles(user);const permissions=new Set(user.permissions||rolePermissions[user.role]||[]);if(roles.includes('MEMBER'))permissions.add('member.self');return {id:user.id,name:user.name,username:user.username||null,email:user.email||null,role:user.role,roles,memberId:user.memberId||null,disabled:Boolean(user.disabled),permissions:[...permissions],createdAt:user.createdAt};}",
              "expor papéis combinados sem remover o papel legado",
          )
          replace_once(
              "server.mjs",
              "const validNumber = (v) => v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));",
              "const validNumber = (v) => v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v));\nfunction normalizeOwnedBrawlers(items){if(!Array.isArray(items))return [];const normalizeItems=list=>(Array.isArray(list)?list:[]).slice(0,20).map(value=>{if(typeof value==='number')return {id:validNumber(value)?Number(value):null,name:null};if(typeof value==='string')return {id:validNumber(value)?Number(value):null,name:validNumber(value)?null:(safeText(value,80)||null)};return {id:validNumber(value?.id)?Number(value.id):null,name:safeText(value?.name,80)||null};}).filter(item=>item.id!==null||item.name);return items.slice(0,120).map(b=>({id:b?.id??null,name:safeText(b?.name,80),trophies:validNumber(b?.trophies)?Number(b.trophies):null,highestTrophies:validNumber(b?.highestTrophies)?Number(b.highestTrophies):null,power:validNumber(b?.power)?Number(b.power):null,rank:validNumber(b?.rank)?Number(b.rank):null,gadgets:normalizeItems(b?.gadgets),starPowers:normalizeItems(b?.starPowers),gears:normalizeItems(b?.gears)})).filter(b=>b.name);}",
              "normalizar equipamento individual de Brawlers somente quando a API fornecer",
          )
          replace_once(
              "server.mjs",
              "brawlers:Array.isArray(p.brawlers)?p.brawlers.map(b=>({id:b.id??null,name:b.name,trophies:validNumber(b.trophies)?Number(b.trophies):null,highestTrophies:validNumber(b.highestTrophies)?Number(b.highestTrophies):null,power:validNumber(b.power)?Number(b.power):null,rank:validNumber(b.rank)?Number(b.rank):null})):[],",
              "brawlers:normalizeOwnedBrawlers(p.brawlers),",
              "preservar gadgets, poderes e equipamentos reais no perfil",
          )
          replace_once(
              "server.mjs",
              "brawlers:Array.isArray(api.player.brawlers)?api.player.brawlers.map(b=>({id:b.id??null,name:b.name,trophies:validNumber(b.trophies)?Number(b.trophies):null,highestTrophies:validNumber(b.highestTrophies)?Number(b.highestTrophies):null,power:validNumber(b.power)?Number(b.power):null,rank:validNumber(b.rank)?Number(b.rank):null})):[],",
              "brawlers:api?normalizeOwnedBrawlers(api.player.brawlers):[],",
              "preservar equipamento na captura inicial de baseline",
          )

          # Migração aditiva: papéis e perfis existentes são preservados; candidaturas sem aprovação voltam à análise.
          migration = r'''  const legacyActivatedApplications=store.applications.filter(application=>application.status==='ACTIVE'&&!applicationWasApproved(application)&&!(Array.isArray(application.history)&&application.history.some(entry=>entry?.status==='REJECTED')));
            for(let offset=0;offset<legacyActivatedApplications.length;offset+=100){
              const batchIds=new Set(legacyActivatedApplications.slice(offset,offset+100).map(application=>application.id));
              await mutate(()=>{for(const application of store.applications.filter(item=>batchIds.has(item.id)&&item.status==='ACTIVE'&&!applicationWasApproved(item)&&!(Array.isArray(item.history)&&item.history.some(entry=>entry?.status==='REJECTED')))){application.history=Array.isArray(application.history)?application.history:[];const activation=application.history.find(entry=>entry?.status==='ACTIVE');const approval={status:'APPROVED',at:activation?.at||application.updatedAt||application.createdAt||nowISO(),by:'Migração Star Park 6.0.0',reason:'Elegibilidade preservada: a entrada já havia sido ativada após confirmação manual no fluxo anterior.'};const activeIndex=application.history.findIndex(entry=>entry?.status==='ACTIVE');application.history.splice(activeIndex>=0?activeIndex:application.history.length,0,approval);audit(null,'Aprovação histórica preservada',`${application.displayName} • ${application.playerTag}`);}});
            }
            if(legacyActivatedApplications.length)console.info(`[STAR PARK] ${legacyActivatedApplications.length} membro(s) já ativado(s) tiveram a aprovação histórica preservada.`);
            const bypassedApplications=store.applications.filter(application=>application.status==='AWAITING_WHATSAPP'&&!applicationWasApproved(application));
            for(let offset=0;offset<bypassedApplications.length;offset+=100){
              const batchIds=new Set(bypassedApplications.slice(offset,offset+100).map(application=>application.id));
              await mutate(()=>{for(const application of store.applications.filter(item=>batchIds.has(item.id)&&item.status==='AWAITING_WHATSAPP'&&!applicationWasApproved(item))){application.status='PENDING';application.updatedAt=nowISO();application.reservationExpiresAt=null;application.history=Array.isArray(application.history)?application.history:[];application.history.push({status:'PENDING',at:nowISO(),by:'Sistema 6.0.0',reason:'Revisão de segurança: a candidatura não tinha registro de aprovação administrativa.'});audit(null,'Candidatura devolvida para análise',`${application.displayName} • ${application.playerTag}`);}});
            }
            if(bypassedApplications.length)console.info(`[STAR PARK] ${bypassedApplications.length} candidatura(s) sem aprovação explícita voltaram para análise.`);
          '''
          replace_once(
              "server.mjs",
              "  if(OWNER_EMAIL&&OWNER_PASSWORD){",
              migration + "  if(OWNER_EMAIL&&OWNER_PASSWORD){",
              "migrar candidaturas antigas que avançaram sem aprovação explícita",
          )

          # Guardar os dados públicos da API no instante da candidatura para facilitar a triagem.
          replace_once(
              "server.mjs",
              "      let apiLookupStatus='PENDING',trophiesAtApplication=null,applicationTrophiesCapturedAt=null,verifiedNickname=gameNickname;",
              "      let apiLookupStatus='PENDING',trophiesAtApplication=null,applicationTrophiesCapturedAt=null,verifiedNickname=gameNickname,playerStatsAtApplication=null,clubAtApplication=null,brawlersAtApplication=[];",
              "preparar snapshot de perfil da API para a análise administrativa",
          )
          replace_once(
              "server.mjs",
              "      try{const api=await fetchPlayer(tag);apiLookupStatus='OK';trophiesAtApplication=validNumber(api.player.trophies)?Number(api.player.trophies):null;applicationTrophiesCapturedAt=api.fetchedAt;verifiedNickname=api.player.name||gameNickname;}catch(e){apiLookupStatus='UNAVAILABLE';}",
              "      try{const api=await fetchPlayer(tag);apiLookupStatus='OK';trophiesAtApplication=validNumber(api.player.trophies)?Number(api.player.trophies):null;applicationTrophiesCapturedAt=api.fetchedAt;verifiedNickname=api.player.name||gameNickname;playerStatsAtApplication=normalizePlayerStats(api.player);clubAtApplication=safeText(api.player.club?.name,80)||null;brawlersAtApplication=normalizeOwnedBrawlers(api.player.brawlers).slice(0,12);}catch(e){apiLookupStatus='UNAVAILABLE';}",
              "capturar troféus, clube, estatísticas e Brawlers informados pela API sem criar valores",
          )
          # ------------------------------------------------------------
          # 3. Recrutamento: sempre PENDING; WhatsApp não substitui aprovação
          # ------------------------------------------------------------
          replace_regex(
              "server.mjs",
              r"const application=\{id:id\(\),displayName,gameNickname:verifiedNickname,playerTag:tag,ageRange,phone,phoneType,desiredBrawlerId:brawler.id,desiredBrawlerKey:brawler.key,desiredBrawlerName:brawler.name,motivation,status:'AWAITING_WHATSAPP',apiLookupStatus,trophiesAtApplication,applicationTrophiesCapturedAt,wantsMemberAccount:body\.wantsMemberAccount===true,submittedAt:nowISO\(\),createdAt:nowISO\(\),updatedAt:nowISO\(\),privateNotes:\[\],history:\[\{status:'AWAITING_WHATSAPP',at:nowISO\(\),by:'Sistema',reason:'Avanco automatico para confirmacao manual de entrada na comunidade WhatsApp\.'\}\],reservationExpiresAt:null,whatsappCommunityUrl:WHATSAPP_COMMUNITY_URL\};",
              "const application={id:id(),displayName,gameNickname:verifiedNickname,playerTag:tag,ageRange,phone,phoneType,desiredBrawlerId:brawler.id,desiredBrawlerKey:brawler.key,desiredBrawlerName:brawler.name,motivation,status:'PENDING',apiLookupStatus,trophiesAtApplication,applicationTrophiesCapturedAt,playerStatsAtApplication,clubAtApplication,brawlersAtApplication,submittedAt:nowISO(),createdAt:nowISO(),updatedAt:nowISO(),privateNotes:[],history:[{status:'PENDING',at:nowISO(),by:'Sistema',reason:'Candidatura recebida e encaminhada para análise administrativa.'}],reservationExpiresAt:null,whatsappCommunityUrl:WHATSAPP_COMMUNITY_URL};",
              "não permitir que o envio pule a análise administrativa",
          )
          replace_line(
              "server.mjs",
              "      await mutate(()=>{if(!store.settings.recruitmentOpen)",
              "      await mutate(()=>{if(!store.settings.recruitmentOpen)throw httpError(403,store.settings.recruitmentClosedMessage||'O recrutamento está fechado.');if(brawlerState(brawler.key)!=='AVAILABLE')throw httpError(409,'Este Brawler foi reservado por outra candidatura. Escolha outro.');if(store.applications.some(a=>cleanTag(a.playerTag)===tag&&activeStatuses.has(a.status))||store.members.some(m=>cleanTag(m.playerTag)===tag&&m.status==='ACTIVE'))throw httpError(409,'Já existe uma candidatura ativa ou vínculo cadastrado para esta tag.');store.applications.unshift(application);audit(null,'Candidatura recebida',`${displayName} • ${tag} • ${brawler.name}`);});return sendJSON(res,201,{ok:true,applicationId:application.id,status:application.status,apiLookupStatus,whatsappCommunityUrl:WHATSAPP_COMMUNITY_URL,message:'Candidatura recebida para análise. Você pode entrar no WhatsApp enquanto aguarda; isso não significa aprovação. Após a aprovação e confirmação da equipe, poderá solicitar sua conta de membro.'});",
              "informar corretamente o status inicial e o próximo passo",
          )

          # Confirmar WhatsApp exige prova anterior de aprovação no histórico.
          replace_once(
              "server.mjs",
              "if(app.status!=='AWAITING_WHATSAPP')throw httpError(409,'A candidatura precisa estar aguardando confirmação do WhatsApp.');",
              "if(app.status!=='AWAITING_WHATSAPP'||!applicationWasApproved(app))throw httpError(409,'A candidatura precisa estar aprovada pela administração e aguardando confirmação do WhatsApp.');",
              "proteger endpoint de ativação do membro",
          )
          replace_once(
              "server.mjs",
              "if(app.status!=='AWAITING_WHATSAPP'||brawlerState(brawler.key)!=='RESERVED')throw httpError(409,'A candidatura ou a reserva mudou durante a ativação. Recarregue a lista.');",
              "if(app.status!=='AWAITING_WHATSAPP'||!applicationWasApproved(app)||brawlerState(brawler.key)!=='RESERVED')throw httpError(409,'A candidatura aprovada ou a reserva mudou durante a ativação. Recarregue a lista.');",
              "revalidar aprovação dentro da mutação serializada",
          )

          # ------------------------------------------------------------
          # 4. Solicitação/ aprovação de conta: somente candidaturas aprovadas
          # ------------------------------------------------------------
          replace_once(
              "server.mjs",
              "const member=store.members.find(m=>cleanTag(m.playerTag)===tag&&m.status==='ACTIVE');\n      if(!member)throw httpError(409,'Não encontramos um membro ativo com essa tag. A administração precisa cadastrar e ativar sua entrada na House primeiro.');",
