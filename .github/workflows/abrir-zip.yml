
name: Abrir zip

on:
  workflow_dispatch:
  push:
    paths:
      - "star-park-v5.0.1-separado-publico-privado.zip"

permissions:
  contents: write

jobs:
  abrir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Abrir o último ZIP e enviar os arquivos
        run: |
          ZIP="star-park-v5.0.1-separado-publico-privado.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Arquivo ZIP não encontrado: $ZIP"
            exit 1
          fi

          unzip -oq "$ZIP" -d .

          rm -f "$ZIP"

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A
          git commit -m "Atualização STAR-PARK v5.0.1" || echo "Nada a enviar"
          git push
          
