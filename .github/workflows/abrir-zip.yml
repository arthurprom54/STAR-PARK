
name: Atualizar STAR PARK pelo ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

concurrency:
  group: atualizar-star-park
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync

      - name: Abrir e atualizar arquivos
        run: |
          ZIP="star-park-v5.0.1-candidatura-corrigida.zip"
          TEMP="$RUNNER_TEMP/star-park"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP não encontrado: $ZIP"
            exit 1
          fi

          mkdir -p "$TEMP"
          unzip -q "$ZIP" -d "$TEMP"

          if [ ! -d "$TEMP/star-park" ]; then
            echo "A pasta star-park não foi encontrada dentro do ZIP."
            exit 1
          fi

          mkdir -p star-park

          rsync -a --delete \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="node_modules/" \
            "$TEMP/star-park/" star-park/

      - name: Salvar alterações no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add star-park/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Atualização automática do STAR PARK"
          git push
          
