          STAR_PARK_ZIP_B64
          base64 --decode /tmp/star-park-v5.0.2.zip.b64 > /tmp/star-park-v5.0.2.zip
          unzip -t /tmp/star-park-v5.0.2.zip
          mkdir -p /tmp/star-park-payload
          unzip -q /tmp/star-park-v5.0.2.zip -d /tmp/star-park-payload
          test -d /tmp/star-park-payload/star-park

          # Preserva a pasta .github que já está no repositório.
          # O token padrão do Actions pode não ter permissão para alterar workflows.
          mkdir -p /tmp/star-park-bootstrap
          if [[ -d .github ]]; then
            cp -a .github /tmp/star-park-bootstrap/github
          fi

          # O pacote contém um workflow opcional de deploy do Render.
          # Não o instala aqui: isso exigiria a permissão especial "workflows".
          rm -rf /tmp/star-park-payload/star-park/.github

          # Limpa o conteúdo antigo do repositório, sem apagar o histórico Git.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          if [[ -d /tmp/star-park-bootstrap/github ]]; then
            cp -a /tmp/star-park-bootstrap/github .github
          fi

          # Copia os arquivos do projeto para a raiz do repositório.
          cp -a /tmp/star-park-payload/star-park/. .

          echo 'Arquivos da versão 5.0.2 copiados.'
          test -f package.json
          test -f server.mjs
          test -f public/index.html

      - name: Validar sintaxe e executar os testes
        shell: bash
        run: |
          set -euo pipefail
          node --check server.mjs
          node --check lib/brawl-stats.mjs
          node --check lib/firestore-store.mjs
          node --check public/app.js
          npm test

      - name: Salvar todas as alterações no GitHub
        shell: bash
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'O repositório já contém exatamente esta versão; nada para atualizar.'
          else
            git commit -m 'Instala Star Park 5.0.2 completo'
            git push origin "HEAD:${GH_BRANCH}"
          fi
          {
            echo '### Star Park 5.0.2 instalado'
            echo 'O conteúdo completo do pacote foi aplicado ao repositório.'
            echo 'Os testes automatizados passaram antes do commit.'
            echo 'O deploy no Render ainda precisa ser acionado/configurado separadamente.'
          } >> "$GITHUB_STEP_SUMMARY"
