# STAR PARK 5.0.2 — instalador de todo o projeto em um único arquivo.
# Coloque este arquivo em .github/workflows/instalar-star-park.yml
# Depois abra GitHub > Actions > "Instalar Star Park 5.0.2" > Run workflow.
# Preserva os workflows existentes para não exigir a permissão especial 'workflows'.
# O workflow substitui os arquivos do projeto pelo conteúdo completo do pacote 5.0.2.

name: Instalar Star Park 5.0.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instalar-star-park-v5-0-2
  cancel-in-progress: false

jobs:
  instalar:
    name: Reconstruir o projeto completo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruir todos os arquivos do Star Park
