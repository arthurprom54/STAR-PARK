name: STAR PARK 5.1.0 - Preparar branch de revisão

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: star-park-prepare-5-1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar somente a branch de revisão
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe do reparador
        run: python -m py_compile tooling/patch-5-1-0-workflow.py
      - name: Corrigir o instalador com marcadores exatos
        run: python tooling/patch-5-1-0-workflow.py
      - name: Verificar integridade do diff
        run: git diff --check
      - name: Salvar somente a correção do instalador no mesmo branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "O instalador já estava corrigido; nenhuma gravação necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/star-park-grande-atualizacao.yml
          git commit -m "Harden STAR PARK 5.1.0 updater before review"
          git push origin "HEAD:${HEAD_REF}"
      - name: Resumo
        if: always()
        run: |
          {
            echo "## Preparação do instalador 5.1.0"
            echo "- Este workflow atua somente na branch do PR."
            echo "- Não faz merge, deploy nem modifica o Firestore."
            echo "- O workflow principal deve ser iniciado manualmente depois que esta preparação terminar."
          } >> "$GITHUB_STEP_SUMMARY"
